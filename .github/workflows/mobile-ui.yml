name: Mobile interface smoke
on:
  pull_request:

permissions:
  contents: read

jobs:
  responsive-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install test dependencies
        run: |
          npm ci --no-audit --no-fund
          npm --prefix functions install --no-audit --no-fund
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Exercise mobile account and patient screens
        run: npx firebase-tools emulators:exec --project demo-patient-case-manager --only auth,firestore "node tests/mobile-smoke.cjs"
      - name: Upload mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-ui-screenshots
          path: mobile-ui-screenshots/
          if-no-files-found: ignore
