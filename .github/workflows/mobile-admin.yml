name: Mobile administrator smoke

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  admin-mobile-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install test dependencies
        run: |
          npm ci --no-audit --no-fund
          npm --prefix functions install --no-audit --no-fund
          npm install --no-save --no-package-lock playwright@1.56.1
      - name: Test mobile administration with Firebase emulators
        run: npx firebase-tools emulators:exec --project demo-patient-case-manager --only auth,firestore "node tests/mobile-admin-smoke.cjs"
      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-admin-error
          path: mobile-ui-screenshots/
          if-no-files-found: ignore
