name: Deploy Firebase — Production

on:
  workflow_dispatch:
    inputs:
      confirm_production_deploy:
        description: "I have verified backups, migration, staging acceptance and the approved registry"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: firebase-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && inputs.confirm_production_deploy == true
    environment: production
    runs-on: ubuntu-latest
    env:
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
      VITE_RECAPTCHA_ENTERPRISE_SITE_KEY: ${{ vars.VITE_RECAPTCHA_ENTERPRISE_SITE_KEY }}
      VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
      VITE_CLINIC_NAME: ${{ vars.VITE_CLINIC_NAME }}
      VITE_CLINIC_ADDRESS: ${{ vars.VITE_CLINIC_ADDRESS }}
      VITE_CLINIC_CONTACT: ${{ vars.VITE_CLINIC_CONTACT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Confirm complete Firebase web configuration
        run: |
          for key in VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_PROJECT_ID VITE_FIREBASE_STORAGE_BUCKET VITE_FIREBASE_MESSAGING_SENDER_ID VITE_FIREBASE_APP_ID VITE_RECAPTCHA_ENTERPRISE_SITE_KEY VITE_CLINIC_NAME VITE_CLINIC_ADDRESS; do
            if [[ -z "${!key}" ]]; then
              echo "::error::Missing required GitHub Actions variable: $key"
              exit 1
            fi
          done
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - run: npm ci --no-audit --no-fund
      - run: npm --prefix functions install --no-audit --no-fund
      - run: npm test
      - run: npm run test:rules
      - run: npm run build
      - run: npm run build:functions
      - name: Deploy verified production release
        run: npx firebase-tools deploy --project "$VITE_FIREBASE_PROJECT_ID" --only hosting,firestore,storage,functions
